<div class="w-full">
    <h2 class="text-2xl font-bold text-[#0b1a30] mb-6 text-center">
        @if (!willRegister) { Acessar Conta } @else { Criar Conta }
    </h2>

    <!-- Formulário de Login -->
    @if (!willRegister) {
    <form id="loginForm" [formGroup]="loginForm" (ngSubmit)="makeLogin()" class="space-y-4">
        <div>
            <label for="loginEmail" class="block text-sm font-medium text-[#0b1a30] mb-1">Seu email</label>
            <input type="email" id="loginEmail" placeholder="Seu email" formControlName="loginEmail"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#f37021] focus:border-transparent">
        </div>

        <div>
            <label for="loginPassword" class="block text-sm font-medium text-[#0b1a30] mb-1">Senha</label>
            <div class="relative">
                <input [type]="showPassword ? 'text' : 'password'" id="loginPassword" placeholder="Sua senha"
                    formControlName="loginPassword"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#f37021] focus:border-transparent">
                <button type="button" (click)="toggleShowPassword()"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm text-gray-500 hover:text-[#f37021]">
                    @if (showPassword) { Ocultar } @else { Mostrar }
                </button>
            </div>
        </div>

        <button type="submit" [disabled]="!loginForm.valid"
            class="w-full mt-2 bg-[#f37021] hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Acessar
        </button>
    </form>
    }

    <!-- Formulário de Registro -->
    @if (willRegister) {
    <form [formGroup]="registerForm" id="RegisterForm" (ngSubmit)="makeRegistration()" class="space-y-4">
        <div>
            <label for="registerEmail" class="block text-sm font-medium text-[#0b1a30] mb-1">Seu melhor e-mail</label>
            <input type="text" id="registerEmail" placeholder="Seu melhor e-mail!" formControlName="registerEmail"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#f37021] focus:border-transparent">
        </div>

        <div>
            <label for="registerPassword" class="block text-sm font-medium text-[#0b1a30] mb-1">Escolha uma
                senha</label>
            <div class="relative">
                <input [type]="showPassword ? 'text' : 'password'" id="registerPassword"
                    placeholder="Escolha uma boa senha :)" formControlName="registerPassword"
                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#f37021] focus:border-transparent">
                <button type="button" (click)="toggleShowPassword()"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-sm text-gray-500 hover:text-[#f37021]">
                    @if (showPassword) { Ocultar } @else { Mostrar }
                </button>
            </div>
        </div>

        <div>
            <label for="registerPassword2" class="block text-sm font-medium text-[#0b1a30] mb-1">Repita a sua
                senha</label>
            <input [type]="showPassword ? 'text' : 'password'" id="registerPassword2" placeholder="Repita aqui a senha"
                formControlName="registerPassword2"
                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#f37021] focus:border-transparent">
        </div>

        <button type="submit" [disabled]="!registerForm.valid"
            class="w-full mt-2 bg-[#f37021] hover:bg-orange-600 text-white font-medium py-2 px-4 rounded-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Registrar
        </button>
    </form>
    }

    <!-- Toggle Login/Registro -->
    <div class="mt-6 text-center border-t border-gray-200 pt-4">
        @if (!willRegister) {
        <p class="text-sm text-gray-600">
            Não tem conta?
            <button (click)="toggleLoginRegisterSession()"
                class="text-[#0b1a30] font-bold hover:text-[#f37021] transition-colors">Registre-se</button>
        </p>
        } @else {
        <p class="text-sm text-gray-600">
            Já tem conta?
            <button (click)="toggleLoginRegisterSession()"
                class="text-[#0b1a30] font-bold hover:text-[#f37021] transition-colors">Acessar</button>
        </p>
        }
    </div>
</div>
