<div
    class="w-full max-w-5xl mx-auto p-4 md:p-6 bg-white shadow-lg rounded-xl border border-gray-200 mt-8 relative z-10">
    <form class="flex flex-col md:flex-row gap-4 items-end">

        <!-- Endereço -->
        <div class="flex-1 w-full">
            <label for="address" class="block text-sm font-bold text-[#0b1a30] mb-1">
                Onde deseja morar?
            </label>
            <input type="text" id="address" name="address" placeholder="Rua, bairro ou cidade..."
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f37021] focus:border-transparent text-gray-700 placeholder-gray-400">
        </div>

        <!-- Tipo do Imóvel -->
        <div class="w-full md:w-64">
            <label for="propertyType" class="block text-sm font-bold text-[#0b1a30] mb-1">
                Tipo do Imóvel
            </label>
            <select name="propertyType" id="propertyType"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#f37021] focus:border-transparent text-gray-700 bg-white">
                <option value="" disabled selected>Selecione</option>
                <option value="apartamento">Apartamento</option>
                <option value="casa">Casa</option>
            </select>
        </div>

        <!-- Botão de Busca -->
        <div class="w-full md:w-auto">
            <button type="button"
                class="w-full md:w-32 bg-[#f37021] hover:bg-orange-600 text-white font-bold py-3 px-6 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#f37021]">
                Buscar
            </button>
        </div>

    </form>
</div>
