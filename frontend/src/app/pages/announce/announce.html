<h1>Anunciar</h1>
@if(showPropertyOrLoginForm()){
    <app-create-property (propertyCreatedSuccessfully)="toggleShowPropertyOrLoginForm()"></app-create-property>
}
@if(!authService.isLoggedIn()) {
    @if(!showPropertyOrLoginForm()) {
        <app-login-register></app-login-register>
        <button (click)="toggleShowPropertyOrLoginForm()">Voltar</button>
    }
}
